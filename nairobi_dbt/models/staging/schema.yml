version: 2

models:
  - name: stg_rentals
    description: "Silver layer — deduplicated, typed, cleaned rental listings."
    columns:
      - name: property_id
        tests:
          - unique
          - not_null

      - name: dist_to_archives_km
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 100
              config:
                where: "dist_to_archives_km IS NOT NULL"

      - name: value_zone
        tests:
          - accepted_values:
              values: ['Premium', 'Sweet Spot', 'Commuter', 'Mid-range', 'Unknown']

      - name: price_ksh
        tests:
          - dbt_utils.accepted_range:
              min_value: 3000
              max_value: 2000000
              config:
                where: "price_ksh IS NOT NULL"