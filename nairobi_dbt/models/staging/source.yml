version: 2

sources:
  - name: bronze
    database: "{{ env_var('DBT_REDSHIFT_DB') }}"
    schema: bronze
    
    # PRODUCTION FIX: TO_TIMESTAMP safely strips the ISO 'T' and trailing timezone offsets
    loaded_at_field: "TO_TIMESTAMP(scraped_at, 'YYYY-MM-DD\"T\"HH24:MI:SS.US\"+00:00\"')"
    
    # 1. Freshness Check: Now correctly using the timestamp you actually have, with proper parsing
    freshness:
      warn_after:  { count: 25, period: hour } # Given our 24-hour scrape schedule, this will warn if data is more than 25 hours old, allowing a 1-hour buffer for delays.
      error_after: { count: 49, period: hour } # This will error if data is more than 49 hours old, which should never happen under normal operations and indicates a critical failure in the data pipeline.
    
    tables:
      - name: raw_rentals
        tests:
          # 2. Recency Test: Validates data is flowing based on scraping time, now using the correctly parsed timestamp
          # Match our 24-hour daily Airflow schedule with a 26-hour buffer window
          - dbt_utils.recency:
              datepart: hour
              field: "TO_TIMESTAMP(scraped_at, 'YYYY-MM-DD\"T\"HH24:MI:SS.US\"+00:00\"')"
              interval: 26 
              config:
                severity: error
        columns:
          - name: scraped_at
            description: "True UTC ISO text timestamp generated by client.py."
            tests:
              - not_null:
                  config:
                    severity: error

          - name: firehose_arrival_at
            description: "Empty because it is not in client.py and DEFAULT failed."
            tests:
              - not_null:
                  config:
                    severity: warn # Keep as warning so it doesn't block the build
