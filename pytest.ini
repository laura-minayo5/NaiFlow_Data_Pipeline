# pytest.ini
# ===========================================================================
# Pytest Core Configuration Initialization File
# ===========================================================================
# This file defines root execution arguments, configures default runtime flags,
# isolates test directories, and registers metadata marks to prevent warnings.

[pytest]
# 1. TEST ROOT DIRECTORIES & IMPORT RESOLUTIONS
# Natively adds the root and client folders to Python's search paths
pythonpath = . client
testpaths = tests

# 2. DEFAULT RUNTIME ARGUMENTS
# -v: Verbose output tracking individual test functions
# --tb=short: Highly compact traceback display for fast debugging on failures
# --showlocals: Displays local variable states inside failed test routines
# --color=yes: Natively activates color tracking logs

addopts = -v --tb=short --showlocals --color=yes

# 3. INTERACTIVE CONSOLE LOGGING FILTERS
# Silences conversational logs on passing runs, but keeps metadata clean
log_cli = false
log_level = INFO

# 4. CUSTOM MARKER REGISTRATION
# Keeps custom markers tracked to prevent unknown marker deprecation warnings
markers =
    utility: Pure data parsers, currency trimmers, text mining, and regex functions.
    geospatial: Spatial distance math, coordinate mapping, and CSV cache hit evaluations.
    network: External API connections, HTTP posts, and batch pipeline orchestration runs.

